name: Extract earnings mentions

on:
  schedule:
    # Hourly at :23. Picks up events the EDGAR (daily) and transcript
    # (weekly) scrapers created and runs the model over them, at most 3 per
    # run. Nothing to do on most hours: the run exits after one cheap query.
    # GitHub Actions rather than Vercel Cron because Hobby crons are daily-only
    # and a 10-K can need a dozen model calls, past the function duration limit.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      event:
        description: 'Reprocess exactly this earnings_events id, any status (overrides limit)'
        required: false
        default: ''
      limit:
        description: 'Max events this run (default 3; use 20 for a backfill)'
        required: false
        default: ''
      include-failed:
        description: 'Also retry failed events (true/false)'
        required: false
        default: 'false'

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Dispatch inputs arrive through env and are passed as positional
      # arguments, never interpolated into the shell command: the reprocess
      # button in /admin/earnings/[id] dispatches this workflow, so the event
      # id is a value from a web request.
      - name: Run extraction
        run: |
          set --
          if [ -n "$INPUT_EVENT" ]; then set -- "$@" --event "$INPUT_EVENT"; fi
          if [ -n "$INPUT_LIMIT" ]; then set -- "$@" --limit "$INPUT_LIMIT"; fi
          if [ "$INPUT_INCLUDE_FAILED" = "true" ]; then set -- "$@" --include-failed; fi
          npx tsx scripts/run-extraction.ts "$@"
        env:
          INPUT_EVENT: ${{ github.event.inputs.event }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_INCLUDE_FAILED: ${{ github.event.inputs.include-failed }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
