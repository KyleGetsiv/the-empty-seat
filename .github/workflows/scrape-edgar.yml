name: Scrape SEC EDGAR

on:
  schedule:
    # Daily, 14:07 UTC (after US market open filings land). Alphabet files
    # roughly 8 tracked documents a year; daily polling with accession
    # dedupe is cheap and catches earnings 8-Ks the day they post.
    - cron: '7 14 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Only filings on or after this date (YYYY-MM-DD); leave blank for normal run'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run EDGAR scraper
        run: |
          if [ -n "${{ github.event.inputs.since }}" ]; then
            npx tsx scripts/run-scraper-edgar.ts --since "${{ github.event.inputs.since }}"
          else
            npx tsx scripts/run-scraper-edgar.ts
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_USER_AGENT: ${{ secrets.SCRAPER_USER_AGENT }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
